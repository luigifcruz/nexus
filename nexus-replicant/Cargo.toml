[package]
name = "nexus-replicant"
version = "0.1.0"
edition = "2021"

[dependencies]
nexus-common = { path = "../nexus-common" }
bollard = "0.18"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
prost = "0.12"
tonic = "0.11"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prost-types = "0.12"
sysinfo = "0.36"
nvml-wrapper = "0.11"

[build-dependencies]
tonic-build = "0.11"

[[bin]]
name = "nexus-replicant"
path = "src/main.rs"
